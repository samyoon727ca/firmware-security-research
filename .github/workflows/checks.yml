name: checks

# Runs the repository gate (tools/run-checks.sh) on every pull request and on main.
# The gate is deterministic and needs no secrets or network beyond dependency install.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tag in the trailing comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install harness dependency (pymavlink)
        run: python -m pip install --disable-pip-version-check -r tools/mavlink-sectest/requirements.txt

      - name: Tool versions
        run: |
          python3 --version
          gcc --version | head -n 1
          cargo --version

      - name: Run the gate
        run: bash tools/run-checks.sh
